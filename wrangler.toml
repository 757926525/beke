name = "whitefox-blog"
compatibility_date = "2024-05-01"
pages_build_output_dir = "dist"

# Cloudflare D1 边缘数据库绑定
# 注意：若未在 Cloudflare 创建 D1 数据库，请保持以下被注释状态，或将真实 D1 database_id 填入。
# 也可以直接在 Cloudflare Dashboard -> Pages -> Settings -> Functions -> D1 database bindings 中将 "DB" 绑定到数据库。
# [[d1_databases]]
# binding = "DB"
# database_name = "whitefox-db"
# database_id = "your-cloudflare-d1-database-uuid-here"

# (可选) R2 对象存储绑定，用于存储大型图片与媒体文件
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "whitefox-assets"

# 环境变量：可在 Cloudflare Pages 控制台设置，或本地 .dev.vars
[vars]
# SYNC_BEARER_TOKEN = "your-custom-secure-sync-token"
